name: CI_build

on: [push, pull_request]

jobs:
  build:

    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_platform: [x64, x86]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        submodules: 'true'

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: MSBuild of plugin dll Debug
      working-directory: .\projects\msvc2017
      run: |
           msbuild nppcrypt.sln /m /t:cmdline /m /p:configuration=Debug /p:platform="${{ matrix.build_platform }}"
           msbuild nppcrypt.sln /m /t:cryptlib /m /p:configuration=Debug /p:platform="${{ matrix.build_platform }}"
           msbuild nppcrypt.sln /m /t:nppcrypt /m /p:configuration=Debug /p:platform="${{ matrix.build_platform }}"

    - name: MSBuild of plugin dll Release
      working-directory: .\projects\msvc2017
      run: |
           msbuild nppcrypt.sln /m /t:cmdline /p:configuration=Release /p:platform="${{ matrix.build_platform }}"
           msbuild nppcrypt.sln /m /t:cryptlib /p:configuration=Release /p:platform="${{ matrix.build_platform }}"
           msbuild nppcrypt.sln /m /t:nppcrypt /p:configuration=Release /p:platform="${{ matrix.build_platform }}"

    - uses: olegtarasov/get-tag@v2.1.4
      id: tagName

    - name: zip artifacts for Release ${{ matrix.build_platform }}
      run: |
           7z a nppcrypt_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip .\bin\nppcrypt\${{ matrix.build_platform }}\Release\nppcrypt.dll

    - name: Archive artifacts for Release ${{ matrix.build_platform }}
      uses: actions/upload-artifact@v7
      with:
        name: nppcrypt_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip
        path: nppcrypt_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip

    - name: Create release on tagging
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: nppcrypt_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip